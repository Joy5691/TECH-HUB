<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - TECH HUB</title>
    
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-top">
            <div class="container">
                <div>
                    <i class="fas fa-phone"></i> +880 1234-567890
                    <i class="fas fa-envelope"></i> support@techhub.com
                </div>
                <div>
                    <a href="#">Track Order</a>
                    <a href="#">Help</a>
                </div>
            </div>
        </div>
        
        <div class="navbar-main">
            <div class="container">
                <a href="../../index.html" class="logo">
                    <i class="fas fa-microchip"></i> TECH<span>HUB</span>
                </a>
                
                <div class="search-bar">
                    <input type="text" placeholder="Search products..." id="searchInput">
                    <button onclick="performSearch()"><i class="fas fa-search"></i></button>
                </div>
                
                <div class="nav-icons">
                    <div class="nav-icon" onclick="window.location.href='dashboard.html'">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="nav-icon" onclick="window.location.href='../products/comparison.html'">
                        <i class="fas fa-exchange-alt"></i>
                        <span class="badge" id="compareCount">0</span>
                    </div>
                    <div class="nav-icon" onclick="window.location.href='cart.html'">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge" id="cartCount">0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="navbar-menu">
            <div class="container">
                <a href="../../index.html" class="menu-item">Home</a>
                <a href="../products/categories.html?cat=laptop" class="menu-item">Laptops</a>
                <a href="../products/categories.html?cat=desktop" class="menu-item">Desktops</a>
                <a href="../products/categories.html?cat=phone" class="menu-item">Phones</a>
                <a href="../products/listing.html" class="menu-item">All Products</a>
                <a href="../../contact.html" class="menu-item">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="section">
        <div class="container">
            <h1 style="font-size: 2rem; margin-bottom: 2rem;">
                <i class="fas fa-shopping-cart"></i> Shopping Cart
            </h1>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
                <!-- Cart Items -->
                <div>
                    <div class="card">
                        <div class="card-body">
                            <div id="cartItems">
                                <!-- Cart items will be rendered here by cart.js -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cart Summary -->
                <div>
                    <div class="card" style="position: sticky; top: 100px;">
                        <div class="card-body">
                            <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Cart Summary</h2>

                            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                                <span style="color: var(--gray);">Subtotal</span>
                                <span style="font-weight: 600;" id="cartSubtotal">৳0</span>
                            </div>

                            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                                <span style="color: var(--gray);">Shipping</span>
                                <span style="font-weight: 600; color: var(--success);">FREE</span>
                            </div>

                            <div style="border-top: 2px solid var(--light-gray); margin: 1rem 0;"></div>

                            <div style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
                                <span style="font-size: 1.25rem; font-weight: 700;">Total</span>
                                <span style="font-size: 1.5rem; font-weight: 700; color: var(--primary-red);" id="cartTotal">৳0</span>
                            </div>

                            <a href="checkout.html" class="btn btn-red" style="width: 100%; margin-bottom: 1rem; text-align: center; display: inline-block; text-decoration: none;">
                                <i class="fas fa-credit-card"></i> Proceed to Checkout
                            </a>

                            <a href="../products/listing.html" class="btn btn-outline" style="width: 100%; text-align: center; display: inline-block; text-decoration: none;">
                                <i class="fas fa-shopping-bag"></i> Continue Shopping
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom text-center" style="padding: 2rem 0;">
                <p>&copy; 2025 TECH HUB. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../../js/cart.js"></script>
    <script src="../../js/main.js"></script>
</body>
</html>
