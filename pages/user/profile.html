<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - TECH HUB</title>
    
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-main">
            <div class="container">
                <a href="../../index.html" class="logo">
                    <i class="fas fa-microchip"></i> TECH<span>HUB</span>
                </a>
                <div style="display: flex; gap: 1rem;">
                    <a href="dashboard.html" class="btn btn-outline">
                        <i class="fas fa-arrow-left"></i> Dashboard
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Profile Section -->
    <section class="section">
        <div class="container" style="max-width: 800px;">
            <h1 style="font-size: 2rem; margin-bottom: 2rem;">
                <i class="fas fa-user-edit"></i> My Profile
            </h1>

            <div class="card">
                <div class="card-body" style="padding: 3rem;">
                    <!-- Profile Picture -->
                    <div style="text-align: center; margin-bottom: 3rem;">
                        <div style="width: 120px; height: 120px; border-radius: 50%; background: var(--primary-red); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 1rem;">
                            <i class="fas fa-user"></i>
                        </div>
                        <button class="btn btn-outline">
                            <i class="fas fa-camera"></i> Change Photo
                        </button>
                    </div>

                    <!-- Profile Form -->
                    <form id="profileForm" onsubmit="handleProfileUpdate(event)">
                        <div class="grid grid-2" style="gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" name="firstName" id="firstName" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" name="lastName" id="lastName" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" name="email" id="email" disabled>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" name="phone" id="phone" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Street Address</label>
                            <input type="text" class="form-control" name="address" id="address">
                        </div>

                        <div class="grid grid-3" style="gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" name="city" id="city">
                            </div>
                            <div class="form-group">
                                <label class="form-label">State</label>
                                <input type="text" class="form-control" name="state" id="state">
                            </div>
                            <div class="form-group">
                                <label class="form-label">ZIP Code</label>
                                <input type="text" class="form-control" name="zip" id="zip">
                            </div>
                        </div>

                        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                            <button type="submit" class="btn btn-red" style="flex: 1;">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                            <button type="button" class="btn btn-outline" onclick="window.location.href='dashboard.html'">
                                <i class="fas fa-times"></i> Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Change Password -->
            <div class="card" style="margin-top: 2rem;">
                <div class="card-body" style="padding: 2rem;">
                    <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;">
                        <i class="fas fa-lock"></i> Change Password
                    </h2>

                    <form id="passwordForm" onsubmit="handlePasswordChange(event)">
                        <div class="form-group">
                            <label class="form-label">Current Password</label>
                            <input type="password" class="form-control" name="currentPassword" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" name="newPassword" required minlength="6">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" name="confirmPassword" required>
                        </div>

                        <button type="submit" class="btn btn-red">
                            <i class="fas fa-key"></i> Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom text-center" style="padding: 2rem 0;">
                <p>&copy; 2025 TECH HUB. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script type="module" src="../../firebase/firebase-config.js"></script>
    <script type="module" src="../../firebase/auth.js"></script>
    <script type="module" src="../../firebase/database.js"></script>
    <script type="module">
        import authManager from '../../firebase/auth.js';
        import databaseManager from '../../firebase/database.js';

        async function loadProfile() {
            const user = authManager.getCurrentUser();
            
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Set email
            document.getElementById('email').value = user.email;

            // Load user profile from Firestore
            try {
                const profile = await databaseManager.getUserProfile(user.uid);
                if (profile) {
                    document.getElementById('firstName').value = profile.firstName || '';
                    document.getElementById('lastName').value = profile.lastName || '';
                    document.getElementById('phone').value = profile.phone || '';
                    document.getElementById('address').value = profile.address?.street || '';
                    document.getElementById('city').value = profile.address?.city || '';
                    document.getElementById('state').value = profile.address?.state || '';
                    document.getElementById('zip').value = profile.address?.zip || '';
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        async function handleProfileUpdate(event) {
            event.preventDefault();
            
            const user = authManager.getCurrentUser();
            if (!user) return;

            const formData = new FormData(event.target);
            const profileData = {
                firstName: formData.get('firstName'),
                lastName: formData.get('lastName'),
                phone: formData.get('phone'),
                address: {
                    street: formData.get('address'),
                    city: formData.get('city'),
                    state: formData.get('state'),
                    zip: formData.get('zip')
                }
            };

            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            submitBtn.disabled = true;

            try {
                await databaseManager.createUserProfile(user.uid, profileData);
                alert('✅ Profile updated successfully!');
            } catch (error) {
                console.error('Error updating profile:', error);
                alert('❌ Failed to update profile. Please try again.');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }

        function handlePasswordChange(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const newPassword = formData.get('newPassword');
            const confirmPassword = formData.get('confirmPassword');

            if (newPassword !== confirmPassword) {
                alert('❌ Passwords do not match!');
                return;
            }

            alert('ℹ️ Password change functionality requires re-authentication. Please contact support.');
        }

        window.handleProfileUpdate = handleProfileUpdate;
        window.handlePasswordChange = handlePasswordChange;

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
