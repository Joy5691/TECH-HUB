<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - TECH HUB</title>
    
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-top">
            <div class="container">
                <div>
                    <i class="fas fa-phone"></i> +880 1234-567890
                    <i class="fas fa-envelope"></i> support@techhub.com
                </div>
                <div>
                    <a href="#">Track Order</a>
                    <a href="#">Help</a>
                </div>
            </div>
        </div>
        
        <div class="navbar-main">
            <div class="container">
                <a href="../../index.html" class="logo">
                    <i class="fas fa-microchip"></i> TECH<span>HUB</span>
                </a>
                
                <div class="search-bar">
                    <input type="text" placeholder="Search products..." id="searchInput">
                    <button onclick="performSearch()"><i class="fas fa-search"></i></button>
                </div>
                
                <div class="nav-icons">
                    <div class="nav-icon" onclick="window.location.href='dashboard.html'">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="nav-icon" onclick="window.location.href='../products/comparison.html'">
                        <i class="fas fa-exchange-alt"></i>
                        <span class="badge" id="compareCount">0</span>
                    </div>
                    <div class="nav-icon" onclick="window.location.href='cart.html'">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge" id="cartCount">0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="navbar-menu">
            <div class="container">
                <a href="../../index.html" class="menu-item">Home</a>
                <a href="../products/categories.html?cat=laptop" class="menu-item">Laptops</a>
                <a href="../products/categories.html?cat=desktop" class="menu-item">Desktops</a>
                <a href="../products/categories.html?cat=phone" class="menu-item">Phones</a>
                <a href="../products/listing.html" class="menu-item">All Products</a>
                <a href="../../contact.html" class="menu-item">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Orders Section -->
    <section class="section">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1 style="font-size: 2rem;">
                    <i class="fas fa-shopping-bag"></i> My Orders
                </h1>
                <a href="dashboard.html" class="btn btn-outline">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>

            <div class="card">
                <div class="card-body">
                    <!-- Filter Tabs -->
                    <div style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid var(--light-gray); padding-bottom: 1rem;">
                        <button class="btn btn-outline" onclick="filterOrders('all')" id="filterAll">
                            All Orders
                        </button>
                        <button class="btn btn-outline" onclick="filterOrders('pending')" id="filterPending">
                            Pending
                        </button>
                        <button class="btn btn-outline" onclick="filterOrders('processing')" id="filterProcessing">
                            Processing
                        </button>
                        <button class="btn btn-outline" onclick="filterOrders('shipped')" id="filterShipped">
                            Shipped
                        </button>
                        <button class="btn btn-outline" onclick="filterOrders('delivered')" id="filterDelivered">
                            Delivered
                        </button>
                    </div>

                    <!-- Orders List -->
                    <div id="ordersList">
                        <div style="text-align: center; padding: 3rem;">
                            <div class="spinner" style="margin: 0 auto;"></div>
                            <p style="color: var(--gray); margin-top: 1rem;">Loading orders...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom text-center" style="padding: 2rem 0;">
                <p>&copy; 2025 TECH HUB. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script type="module" src="../../firebase/firebase-config.js"></script>
    <script type="module" src="../../firebase/auth.js"></script>
    <script type="module" src="../../firebase/database.js"></script>
    <script src="../../js/main.js"></script>
    <script type="module">
        import authManager from '../../firebase/auth.js';
        import databaseManager from '../../firebase/database.js';

        let allOrders = [];

        async function loadOrders() {
            const user = authManager.getCurrentUser();
            
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                allOrders = await databaseManager.getOrdersByUser(user.uid);
                displayOrders(allOrders);
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('ordersList').innerHTML = `
                    <div style="text-align: center; padding: 3rem;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">📦</div>
                        <h3>No orders yet</h3>
                        <p style="color: var(--gray); margin-bottom: 2rem;">Start shopping to see your orders here</p>
                        <a href="../products/listing.html" class="btn btn-red">
                            <i class="fas fa-shopping-bag"></i> Browse Products
                        </a>
                    </div>
                `;
            }
        }

        function displayOrders(orders) {
            const container = document.getElementById('ordersList');
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 3rem;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">📦</div>
                        <h3>No orders found</h3>
                        <p style="color: var(--gray); margin-bottom: 2rem;">Start shopping to see your orders here</p>
                        <a href="../products/listing.html" class="btn btn-red">
                            <i class="fas fa-shopping-bag"></i> Browse Products
                        </a>
                    </div>
                `;
                return;
            }

            const statusColors = {
                pending: 'var(--warning)',
                processing: 'var(--info)',
                shipped: 'var(--primary-red)',
                delivered: 'var(--success)'
            };

            container.innerHTML = orders.map(order => {
                const orderDate = order.createdAt ? new Date(order.createdAt.seconds * 1000).toLocaleDateString() : 'N/A';
                
                return `
                    <div class="card" style="margin-bottom: 1.5rem;">
                        <div class="card-body">
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--light-gray);">
                                <div>
                                    <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">Order #${order.id.substring(0, 12)}</h3>
                                    <p style="color: var(--gray); font-size: 0.9rem;">
                                        <i class="fas fa-calendar"></i> ${orderDate} • 
                                        <i class="fas fa-box"></i> ${order.items.length} items
                                    </p>
                                </div>
                                <div style="text-align: right;">
                                    <span class="badge" style="background: ${statusColors[order.status] || 'var(--gray)'}; color: white; padding: 0.5rem 1rem; text-transform: uppercase;">
                                        ${order.status}
                                    </span>
                                    <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary-red); margin-top: 0.5rem;">
                                        ৳${order.total.toLocaleString()}
                                    </div>
                                </div>
                            </div>

                            <div style="margin-bottom: 1rem;">
                                ${order.items.map(item => `
                                    <div style="display: flex; gap: 1rem; padding: 0.75rem; background: var(--off-white); border-radius: var(--radius-sm); margin-bottom: 0.5rem;">
                                        <div style="font-size: 2rem;">${item.image || '🛒'}</div>
                                        <div style="flex: 1;">
                                            <h4 style="font-size: 0.95rem; margin-bottom: 0.25rem;">${item.name}</h4>
                                            <p style="color: var(--gray); font-size: 0.875rem;">Qty: ${item.quantity} × ৳${item.price.toLocaleString()}</p>
                                        </div>
                                        <div style="font-weight: 600;">৳${(item.price * item.quantity).toLocaleString()}</div>
                                    </div>
                                `).join('')}
                            </div>

                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div style="color: var(--gray); font-size: 0.9rem;">
                                    <i class="fas fa-map-marker-alt"></i> ${order.shippingAddress?.city || 'N/A'}, ${order.shippingAddress?.state || 'N/A'}
                                </div>
                                <div style="display: flex; gap: 0.5rem;">
                                    <button class="btn btn-outline">
                                        <i class="fas fa-eye"></i> Details
                                    </button>
                                    ${order.status === 'delivered' ? `
                                        <button class="btn btn-red">
                                            <i class="fas fa-redo"></i> Reorder
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterOrders(status) {
            // Update active button
            document.querySelectorAll('[id^="filter"]').forEach(btn => {
                btn.classList.remove('btn-red');
                btn.classList.add('btn-outline');
            });
            document.getElementById('filter' + status.charAt(0).toUpperCase() + status.slice(1)).classList.remove('btn-outline');
            document.getElementById('filter' + status.charAt(0).toUpperCase() + status.slice(1)).classList.add('btn-red');

            // Filter orders
            if (status === 'all') {
                displayOrders(allOrders);
            } else {
                const filtered = allOrders.filter(order => order.status === status);
                displayOrders(filtered);
            }
        }

        window.filterOrders = filterOrders;

        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            document.getElementById('filterAll').classList.remove('btn-outline');
            document.getElementById('filterAll').classList.add('btn-red');
        });
    </script>
</body>
</html>
