<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TECH HUB</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Simple Navigation -->
    <nav class="navbar">
        <div class="navbar-main">
            <div class="container">
                <a href="../../index.html" class="logo">
                    <i class="fas fa-microchip"></i>
                    TECH<span>HUB</span>
                </a>
                <div style="display: flex; gap: 1rem;">
                    <a href="../../index.html" class="btn btn-outline">
                        <i class="fas fa-home"></i> Home
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="section">
        <div class="container" style="max-width: 500px;">
            <div class="card animate-scale-in">
                <div class="card-body" style="padding: 3rem;">
                    <div style="text-align: center; margin-bottom: 2rem;">
                        <div style="font-size: 4rem; color: var(--primary-red); margin-bottom: 1rem;">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back!</h1>
                        <p style="color: var(--gray);">Login to your TECH HUB account</p>
                    </div>

                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-envelope"></i> Email Address
                            </label>
                            <input type="email" class="form-control" name="email" placeholder="your@email.com" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-lock"></i> Password
                            </label>
                            <input type="password" class="form-control" name="password" placeholder="Enter your password" required>
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" name="remember">
                                <span>Remember me</span>
                            </label>
                            <a href="#" style="color: var(--primary-red); text-decoration: none;">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn btn-red" style="width: 100%; margin-bottom: 1rem;">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>

                        <div style="text-align: center; margin-top: 1.5rem;">
                            <p style="color: var(--gray);">
                                Don't have an account? 
                                <a href="register.html" style="color: var(--primary-red); font-weight: 600; text-decoration: none;">
                                    Register here
                                </a>
                            </p>
                        </div>
                    </form>

                    <!-- Social Login (Optional) -->
                    <div style="margin-top: 2rem;">
                        <div style="text-align: center; margin-bottom: 1rem; color: var(--gray);">
                            <span style="background: white; padding: 0 1rem; position: relative; z-index: 1;">Or login with</span>
                            <div style="border-top: 1px solid var(--light-gray); margin-top: -0.6rem;"></div>
                        </div>
                        <div style="display: flex; gap: 1rem;">
                            <button class="btn btn-outline" style="flex: 1;">
                                <i class="fab fa-google"></i> Google
                            </button>
                            <button class="btn btn-outline" style="flex: 1;">
                                <i class="fab fa-facebook"></i> Facebook
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- JavaScript -->
    <script type="module" src="../../firebase/firebase-config.js"></script>
    <script type="module" src="../../firebase/auth.js"></script>
    <script src="../../js/validation.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            // Validate form
            if (!formValidator.validateForm(event.target)) {
                return;
            }
            
            const formData = new FormData(event.target);
            const email = formData.get('email');
            const password = formData.get('password');
            
            // Show loading
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            submitBtn.disabled = true;
            
            // Simulate login (replace with actual Firebase auth)
            setTimeout(() => {
                console.log('Login attempt:', { email, password });
                
                // For demo: just redirect to dashboard
                window.location.href = 'dashboard.html';
                
                // Reset button
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }, 1500);
            
            // Actual Firebase implementation:
            // const result = await authManager.login(email, password);
            // if (result.success) {
            //     window.location.href = 'dashboard.html';
            // } else {
            //     showNotification('❌ ' + result.error, 'error');
            //     submitBtn.innerHTML = originalText;
            //     submitBtn.disabled = false;
            // }
        }

        // Setup validation
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            if (form) {
                formValidator.setupRealTimeValidation(form);
            }
        });
    </script>
</body>
</html>
