<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TECH HUB</title>
    
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Simple Navigation -->
    <nav class="navbar">
        <div class="navbar-main">
            <div class="container">
                <a href="../../index.html" class="logo">
                    <i class="fas fa-microchip"></i> TECH<span>HUB</span>
                </a>
                <div style="display: flex; gap: 1rem;">
                    <a href="../../index.html" class="btn btn-outline">
                        <i class="fas fa-home"></i> Home
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="section">
        <div class="container" style="max-width: 500px;">
            <div class="card animate-scale-in">
                <div class="card-body" style="padding: 3rem;">
                    <div style="text-align: center; margin-bottom: 2rem;">
                        <div style="font-size: 4rem; color: var(--primary-red); margin-bottom: 1rem;">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back!</h1>
                        <p style="color: var(--gray);">Login to your TECH HUB account</p>
                    </div>

                    <!-- Error Message Display -->
                    <div id="errorMessage" style="display: none; background: #fee; border: 1px solid #fcc; color: #c00; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
                        <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
                    </div>

                    <!-- Success Message Display -->
                    <div id="successMessage" style="display: none; background: #efe; border: 1px solid #cfc; color: #060; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
                        <i class="fas fa-check-circle"></i> <span id="successText"></span>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-envelope"></i> Email Address
                            </label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-lock"></i> Password
                            </label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required minlength="6" autocomplete="current-password">
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox">
                                <span>Remember me</span>
                            </label>
                            <a href="#" id="forgotPasswordLink" style="color: var(--primary-red); text-decoration: none;">Forgot Password?</a>
                        </div>

                        <button type="button" id="loginBtn" class="btn btn-red" style="width: 100%; margin-bottom: 1rem;">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>

                        <div style="text-align: center; margin-top: 1.5rem;">
                            <p style="color: var(--gray);">
                                Don't have an account? 
                                <a href="register.html" style="color: var(--primary-red); font-weight: 600; text-decoration: none;">
                                    Register here
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Load Firebase -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCdjvP3rdz60el3RPvI2AP5H2LQgnIEwMY",
  authDomain: "tech-hub-8088a.firebaseapp.com",
  projectId: "tech-hub-8088a",
  storageBucket: "tech-hub-8088a.firebasestorage.app",
  messagingSenderId: "792429684960",
  appId: "1:792429684960:web:e9a5681688f14352c78885",
  measurementId: "G-GEDXV1C21F"
};

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        console.log('✅ Firebase initialized on login page');

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const successDiv = document.getElementById('successMessage');
            
            successDiv.style.display = 'none';
            errorText.textContent = message;
            errorDiv.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            setTimeout(() => { errorDiv.style.display = 'none'; }, 5000);
            console.error('❌ Error:', message);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            const errorDiv = document.getElementById('errorMessage');
            
            errorDiv.style.display = 'none';
            successText.textContent = message;
            successDiv.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            console.log('✅ Success:', message);
        }

        // Get error message
        function getErrorMessage(errorCode) {
            const errorMessages = {
                'auth/invalid-email': 'Invalid email address.',
                'auth/user-disabled': 'This account has been disabled.',
                'auth/user-not-found': 'No account found with this email.',
                'auth/wrong-password': 'Incorrect password.',
                'auth/invalid-credential': 'Invalid email or password.',
                'auth/too-many-requests': 'Too many failed attempts. Try again later.',
                'auth/network-request-failed': 'Network error. Check your connection.'
            };
            return errorMessages[errorCode] || `Error: ${errorCode}`;
        }

        // Handle login
        async function handleLogin() {
            console.log('🚀 Login button clicked!');
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }
            
            const submitBtn = document.getElementById('loginBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            submitBtn.disabled = true;
            
            try {
                console.log('📞 Signing in...');
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log('✅ User logged in:', userCredential.user.uid);
                
                showSuccess('Login successful! Redirecting...');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('💥 Login error:', error);
                console.error('Error code:', error.code);
                
                showError(getErrorMessage(error.code));
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }

        // Handle forgot password
        async function handleForgotPassword(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            
            if (!email) {
                showError('Please enter your email address first');
                return;
            }
            
            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess('Password reset email sent! Check your inbox.');
            } catch (error) {
                showError(getErrorMessage(error.code));
            }
        }

        // Attach event listeners
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ DOM loaded, attaching handlers');
            
            const loginBtn = document.getElementById('loginBtn');
            const forgotLink = document.getElementById('forgotPasswordLink');
            
            if (loginBtn) {
                loginBtn.addEventListener('click', handleLogin);
                console.log('✅ Login button handler attached');
            }
            
            if (forgotLink) {
                forgotLink.addEventListener('click', handleForgotPassword);
                console.log('✅ Forgot password handler attached');
            }
        });
    </script>
</body>
</html>
