<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TECH HUB</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Simple Navigation -->
    <nav class="navbar">
        <div class="navbar-main">
            <div class="container">
                <a href="../../index.html" class="logo">
                    <i class="fas fa-microchip"></i>
                    TECH<span>HUB</span>
                </a>
                <div style="display: flex; gap: 1rem;">
                    <a href="../../index.html" class="btn btn-outline">
                        <i class="fas fa-home"></i> Home
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="section">
        <div class="container" style="max-width: 600px;">
            <div class="card animate-scale-in">
                <div class="card-body" style="padding: 3rem;">
                    <div style="text-align: center; margin-bottom: 2rem;">
                        <div style="font-size: 4rem; color: var(--primary-red); margin-bottom: 1rem;">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Create Account</h1>
                        <p style="color: var(--gray);">Join TECH HUB today!</p>
                    </div>

                    <form id="registerForm" onsubmit="handleRegister(event)">
                        <div class="grid grid-2" style="gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label">
                                    <i class="fas fa-user"></i> First Name *
                                </label>
                                <input type="text" class="form-control" name="firstName" placeholder="John" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label">
                                    <i class="fas fa-user"></i> Last Name *
                                </label>
                                <input type="text" class="form-control" name="lastName" placeholder="Doe" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-envelope"></i> Email Address *
                            </label>
                            <input type="email" class="form-control" name="email" placeholder="your@email.com" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-phone"></i> Phone Number *
                            </label>
                            <input type="tel" class="form-control" name="phone" placeholder="01234567890" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-lock"></i> Password *
                            </label>
                            <input type="password" class="form-control" name="password" placeholder="Minimum 6 characters" required>
                            <small style="color: var(--gray); font-size: 0.875rem;">Must be at least 6 characters long</small>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-lock"></i> Confirm Password *
                            </label>
                            <input type="password" class="form-control" name="confirmPassword" placeholder="Re-enter password" required>
                        </div>

                        <div class="form-group">
                            <label style="display: flex; align-items: start; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" name="terms" required style="margin-top: 0.25rem;">
                                <span style="font-size: 0.9rem;">
                                    I agree to the <a href="#" style="color: var(--primary-red);">Terms & Conditions</a> 
                                    and <a href="#" style="color: var(--primary-red);">Privacy Policy</a>
                                </span>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-red" style="width: 100%; margin-bottom: 1rem;">
                            <i class="fas fa-user-plus"></i> Create Account
                        </button>

                        <div style="text-align: center; margin-top: 1.5rem;">
                            <p style="color: var(--gray);">
                                Already have an account? 
                                <a href="login.html" style="color: var(--primary-red); font-weight: 600; text-decoration: none;">
                                    Login here
                                </a>
                            </p>
                        </div>
                    </form>

                    <!-- Social Register -->
                    <div style="margin-top: 2rem;">
                        <div style="text-align: center; margin-bottom: 1rem; color: var(--gray);">
                            <span style="background: white; padding: 0 1rem; position: relative; z-index: 1;">Or register with</span>
                            <div style="border-top: 1px solid var(--light-gray); margin-top: -0.6rem;"></div>
                        </div>
                        <div style="display: flex; gap: 1rem;">
                            <button class="btn btn-outline" style="flex: 1;">
                                <i class="fab fa-google"></i> Google
                            </button>
                            <button class="btn btn-outline" style="flex: 1;">
                                <i class="fab fa-facebook"></i> Facebook
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- JavaScript -->
    <script type="module" src="../../firebase/firebase-config.js"></script>
    <script type="module" src="../../firebase/auth.js"></script>
    <script src="../../js/validation.js"></script>
    <script>
        async function handleRegister(event) {
            event.preventDefault();
            
            // Validate form
            if (!formValidator.validateForm(event.target)) {
                return;
            }
            
            const formData = new FormData(event.target);
            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');
            
            // Check if passwords match
            if (password !== confirmPassword) {
                const confirmInput = event.target.querySelector('input[name="confirmPassword"]');
                formValidator.showError(confirmInput, 'Passwords do not match');
                return;
            }
            
            const userData = {
                firstName: formData.get('firstName'),
                lastName: formData.get('lastName'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                password: password
            };
            
            // Show loading
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
            submitBtn.disabled = true;
            
            // Simulate registration
            setTimeout(() => {
                console.log('Registration data:', userData);
                alert('✅ Account created successfully! Redirecting to login...');
                window.location.href = 'login.html';
            }, 1500);
            
            // Actual Firebase implementation:
            // const result = await authManager.register(userData.email, userData.password, userData.firstName + ' ' + userData.lastName);
            // if (result.success) {
            //     showNotification('✅ Account created successfully!', 'success');
            //     window.location.href = 'login.html';
            // } else {
            //     showNotification('❌ ' + result.error, 'error');
            //     submitBtn.innerHTML = originalText;
            //     submitBtn.disabled = false;
            // }
        }

        // Setup validation
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registerForm');
            if (form) {
                formValidator.setupRealTimeValidation(form);
            }
        });
    </script>
</body>
</html>
