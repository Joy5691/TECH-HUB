<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Comparison - TECH HUB</title>
    
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-top">
            <div class="container">
                <div>
                    <i class="fas fa-phone"></i> +880 1234-567890
                    <i class="fas fa-envelope"></i> support@techhub.com
                </div>
                <div>
                    <a href="#">Track Order</a>
                    <a href="#">Help</a>
                </div>
            </div>
        </div>
        
        <div class="navbar-main">
            <div class="container">
                <a href="../../index.html" class="logo">
                    <i class="fas fa-microchip"></i> TECH<span>HUB</span>
                </a>
                
                <div class="search-bar">
                    <input type="text" placeholder="Search products..." id="searchInput">
                    <button onclick="performSearch()"><i class="fas fa-search"></i></button>
                </div>
                
                <div class="nav-icons">
                    <div class="nav-icon" onclick="window.location.href='../user/dashboard.html'">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="nav-icon" onclick="window.location.href='comparison.html'">
                        <i class="fas fa-exchange-alt"></i>
                        <span class="badge" id="compareCount">0</span>
                    </div>
                    <div class="nav-icon" onclick="window.location.href='../user/cart.html'">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge" id="cartCount">0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="navbar-menu">
            <div class="container">
                <a href="../../index.html" class="menu-item">Home</a>
                <a href="categories.html?cat=laptop" class="menu-item">Laptops</a>
                <a href="categories.html?cat=desktop" class="menu-item">Desktops</a>
                <a href="categories.html?cat=phone" class="menu-item">Phones</a>
                <a href="listing.html" class="menu-item">All Products</a>
                <a href="../../contact.html" class="menu-item">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Comparison Section -->
    <section class="section">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1 style="font-size: 2rem;">
                    <i class="fas fa-exchange-alt"></i> Product Comparison
                </h1>
                <button onclick="clearComparison()" class="btn btn-outline">
                    <i class="fas fa-trash"></i> Clear All
                </button>
            </div>

            <div id="comparisonContainer">
                <div style="text-align: center; padding: 3rem;">
                    <div class="spinner" style="margin: 0 auto;"></div>
                    <p style="color: var(--gray); margin-top: 1rem;">Loading comparison...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom text-center" style="padding: 2rem 0;">
                <p>&copy; 2025 TECH HUB. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="../../js/products.js"></script>
    <script src="../../js/cart.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        function loadComparison() {
            const compareList = JSON.parse(localStorage.getItem('compareList')) || [];
            const container = document.getElementById('comparisonContainer');

            if (compareList.length === 0) {
                container.innerHTML = `
                    <div class="card">
                        <div class="card-body" style="text-align: center; padding: 3rem;">
                            <div style="font-size: 5rem; margin-bottom: 1rem;">📊</div>
                            <h2>No products to compare</h2>
                            <p style="color: var(--gray); margin-bottom: 2rem;">Add up to 3 products to compare their features</p>
                            <a href="listing.html" class="btn btn-red">
                                <i class="fas fa-shopping-bag"></i> Browse Products
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            const products = compareList.map(id => productManager.getProductById(id)).filter(p => p !== undefined);

            if (products.length === 0) {
                clearComparison();
                loadComparison();
                return;
            }

            container.innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr>
                                    <th style="text-align: left; padding: 1rem; background: var(--off-white); border-bottom: 2px solid var(--light-gray);">Feature</th>
                                    ${products.map(product => `
                                        <th style="text-align: center; padding: 1rem; background: var(--off-white); border-bottom: 2px solid var(--light-gray);">
                                            <button onclick="removeFromComparison('${product.id}')" style="float: right; background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.25rem;">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </th>
                                    `).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Product Images -->
                                <tr>
                                    <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); font-weight: 600;">Product</td>
                                    ${products.map(product => `
                                        <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); text-align: center;">
                                            <div style="font-size: 4rem; margin-bottom: 0.5rem;">${product.image}</div>
                                            <h4 style="font-size: 1rem; margin-bottom: 0.5rem;">${product.name}</h4>
                                        </td>
                                    `).join('')}
                                </tr>
                                
                                <!-- Price -->
                                <tr>
                                    <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); font-weight: 600;">Price</td>
                                    ${products.map(product => `
                                        <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); text-align: center;">
                                            <span style="font-size: 1.5rem; font-weight: 700; color: var(--primary-red);">৳${product.price.toLocaleString()}</span>
                                            ${product.oldPrice ? `<br><span style="text-decoration: line-through; color: var(--gray);">৳${product.oldPrice.toLocaleString()}</span>` : ''}
                                        </td>
                                    `).join('')}
                                </tr>
                                
                                <!-- Discount -->
                                <tr>
                                    <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); font-weight: 600;">Discount</td>
                                    ${products.map(product => `
                                        <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); text-align: center;">
                                            ${product.discount > 0 ? `<span class="badge" style="background: var(--success); color: white;">${product.discount}% OFF</span>` : '<span style="color: var(--gray);">No Discount</span>'}
                                        </td>
                                    `).join('')}
                                </tr>
                                
                                <!-- Category -->
                                <tr>
                                    <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); font-weight: 600;">Category</td>
                                    ${products.map(product => `
                                        <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); text-align: center; text-transform: capitalize;">
                                            ${product.category}
                                        </td>
                                    `).join('')}
                                </tr>
                                
                                <!-- Specifications -->
                                <tr>
                                    <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); font-weight: 600;">Specifications</td>
                                    ${products.map(product => `
                                        <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); text-align: center; font-size: 0.9rem; color: var(--gray);">
                                            ${product.specs}
                                        </td>
                                    `).join('')}
                                </tr>
                                
                                <!-- Stock -->
                                <tr>
                                    <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); font-weight: 600;">Availability</td>
                                    ${products.map(product => `
                                        <td style="padding: 1rem; border-bottom: 1px solid var(--light-gray); text-align: center;">
                                            ${product.inStock ? '<span style="color: var(--success); font-weight: 600;"><i class="fas fa-check-circle"></i> In Stock</span>' : '<span style="color: var(--danger); font-weight: 600;"><i class="fas fa-times-circle"></i> Out of Stock</span>'}
                                        </td>
                                    `).join('')}
                                </tr>
                                
                                <!-- Actions -->
                                <tr>
                                    <td style="padding: 1rem; font-weight: 600;">Actions</td>
                                    ${products.map(product => `
                                        <td style="padding: 1rem; text-align: center;">
                                            <button class="btn btn-red" style="width: 100%; margin-bottom: 0.5rem;" onclick="addToCart('${product.id}', '${product.name}', ${product.price})">
                                                <i class="fas fa-cart-plus"></i> Add to Cart
                                            </button>
                                            <button class="btn btn-outline" style="width: 100%;" onclick="window.location.href='detail.html?id=${product.id}'">
                                                <i class="fas fa-eye"></i> View Details
                                            </button>
                                        </td>
                                    `).join('')}
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function removeFromComparison(productId) {
            let compareList = JSON.parse(localStorage.getItem('compareList')) || [];
            compareList = compareList.filter(id => id !== productId);
            localStorage.setItem('compareList', JSON.stringify(compareList));
            updateCompareCount();
            loadComparison();
        }

        function clearComparison() {
            if (confirm('Are you sure you want to clear all comparisons?')) {
                localStorage.removeItem('compareList');
                updateCompareCount();
                loadComparison();
            }
        }

        window.removeFromComparison = removeFromComparison;
        window.clearComparison = clearComparison;

        document.addEventListener('DOMContentLoaded', loadComparison);
    </script>
</body>
</html>
