<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - TECH HUB</title>
    
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-top">
            <div class="container">
                <div>
                    <i class="fas fa-phone"></i> +880 1234-567890
                    <i class="fas fa-envelope"></i> support@techhub.com
                </div>
                <div>
                    <a href="#">Track Order</a>
                    <a href="#">Help</a>
                </div>
            </div>
        </div>
        
        <div class="navbar-main">
            <div class="container">
                <a href="../../index.html" class="logo">
                    <i class="fas fa-microchip"></i> TECH<span>HUB</span>
                </a>
                
                <div class="search-bar">
                    <input type="text" placeholder="Search products..." id="searchInput">
                    <button onclick="performSearch()"><i class="fas fa-search"></i></button>
                </div>
                
                <div class="nav-icons">
                    <div class="nav-icon" onclick="window.location.href='../user/dashboard.html'">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="nav-icon" onclick="window.location.href='comparison.html'">
                        <i class="fas fa-exchange-alt"></i>
                        <span class="badge" id="compareCount">0</span>
                    </div>
                    <div class="nav-icon" onclick="window.location.href='../user/cart.html'">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge" id="cartCount">0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="navbar-menu">
            <div class="container">
                <a href="../../index.html" class="menu-item">Home</a>
                <a href="categories.html?cat=laptop" class="menu-item">Laptops</a>
                <a href="categories.html?cat=desktop" class="menu-item">Desktops</a>
                <a href="categories.html?cat=phone" class="menu-item">Phones</a>
                <a href="listing.html" class="menu-item">All Products</a>
                <a href="../../contact.html" class="menu-item">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Product Detail Section -->
    <section class="section">
        <div class="container">
            <div id="productDetail">
                <!-- Product details will be loaded here -->
                <div class="spinner" style="margin: 3rem auto;"></div>
            </div>
        </div>
    </section>

    <!-- Related Products -->
    <section class="section" style="background: var(--off-white);">
        <div class="container">
            <div class="section-header">
                <h2><i class="fas fa-shopping-bag"></i> Related Products</h2>
            </div>
            
            <div class="grid grid-4" id="relatedProducts">
                <!-- Related products will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom text-center" style="padding: 2rem 0;">
                <p>&copy; 2025 TECH HUB. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="../../js/products.js"></script>
    <script src="../../js/cart.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        function loadProductDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            
            if (!productId) {
                window.location.href = 'listing.html';
                return;
            }
            
            const product = productManager.getProductById(productId);
            
            if (!product) {
                document.getElementById('productDetail').innerHTML = `
                    <div style="text-align: center; padding: 3rem;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">😕</div>
                        <h2>Product not found</h2>
                        <p style="color: var(--gray); margin-bottom: 2rem;">The product you're looking for doesn't exist.</p>
                        <a href="listing.html" class="btn btn-red">Browse Products</a>
                    </div>
                `;
                return;
            }
            
            document.title = `${product.name} - TECH HUB`;
            
            document.getElementById('productDetail').innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; margin-bottom: 3rem;">
                    <!-- Product Images -->
                    <div>
                        <div class="card">
                            <div class="card-body" style="padding: 3rem; text-align: center;">
                                ${product.discount > 0 ? `<div class="discount-badge">-${product.discount}%</div>` : ''}
                                <div style="font-size: 15rem; margin-bottom: 2rem;">
                                    ${product.image}
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Product Info -->
                    <div>
                        <h1 style="font-size: 2rem; margin-bottom: 1rem;">${product.name}</h1>
                        
                        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
                            <div style="color: #ffc107;">
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star-half-alt"></i>
                            </div>
                            <span style="color: var(--gray);">(4.5/5 - 128 reviews)</span>
                        </div>
                        
                        <div style="margin-bottom: 2rem;">
                            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                                <span class="price" style="font-size: 2.5rem;">৳${product.price.toLocaleString()}</span>
                                ${product.oldPrice ? `<span class="price-old" style="font-size: 1.5rem;">৳${product.oldPrice.toLocaleString()}</span>` : ''}
                            </div>
                            ${product.discount > 0 ? `<span class="badge" style="background: var(--success); color: white; padding: 0.5rem 1rem;">Save ৳${(product.oldPrice - product.price).toLocaleString()}</span>` : ''}
                        </div>
                        
                        <div style="background: var(--off-white); padding: 1.5rem; border-radius: var(--radius-md); margin-bottom: 2rem;">
                            <h3 style="font-size: 1.25rem; margin-bottom: 1rem;">
                                <i class="fas fa-info-circle"></i> Product Details
                            </h3>
                            <p style="color: var(--gray); margin-bottom: 1rem;">${product.description}</p>
                            <p style="color: var(--gray);"><strong>Specifications:</strong> ${product.specs}</p>
                        </div>
                        
                        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
                            <span style="color: var(--gray);">Availability:</span>
                            ${product.inStock ? 
                                '<span style="color: var(--success); font-weight: 600;"><i class="fas fa-check-circle"></i> In Stock</span>' : 
                                '<span style="color: var(--danger); font-weight: 600;"><i class="fas fa-times-circle"></i> Out of Stock</span>'
                            }
                        </div>
                        
                        <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                            <button class="btn btn-red btn-lg" style="flex: 1;" onclick="addToCart('${product.id}', '${product.name}', ${product.price})" ${!product.inStock ? 'disabled' : ''}>
                                <i class="fas fa-shopping-cart"></i> Add to Cart
                            </button>
                            <button class="btn btn-outline btn-lg" onclick="addToWishlist('${product.id}')">
                                <i class="fas fa-heart"></i>
                            </button>
                        </div>
                        
                        <div style="display: flex; gap: 1rem;">
                            <button class="btn btn-outline" style="flex: 1;" onclick="window.location.href='../user/checkout.html'">
                                <i class="fas fa-bolt"></i> Buy Now
                            </button>
                            <button class="btn btn-outline" onclick="addToCompare('${product.id}')">
                                <i class="fas fa-exchange-alt"></i> Compare
                            </button>
                        </div>
                        
                        <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--light-gray);">
                            <div style="display: flex; gap: 2rem; color: var(--gray); font-size: 0.9rem;">
                                <div><i class="fas fa-truck"></i> Free Shipping</div>
                                <div><i class="fas fa-undo"></i> 7 Days Return</div>
                                <div><i class="fas fa-shield-alt"></i> Warranty Available</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            loadRelatedProducts(product.category, product.id);
        }
        
        function loadRelatedProducts(category, currentProductId) {
            const related = productManager.getProductsByCategory(category)
                .filter(p => p.id !== currentProductId)
                .slice(0, 4);
            
            const container = document.getElementById('relatedProducts');
            
            if (related.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--gray);">No related products found</p>';
                return;
            }
            
            container.innerHTML = related.map(product => `
                <div class="card hover-lift">
                    ${product.discount > 0 ? `<div class="discount-badge">-${product.discount}%</div>` : ''}
                    <div class="card-img" style="display: flex; align-items: center; justify-content: center; font-size: 5rem;">
                        ${product.image}
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${product.name}</h3>
                        <div style="margin: 1rem 0;">
                            <span class="price">৳${product.price.toLocaleString()}</span>
                            ${product.oldPrice ? `<span class="price-old">৳${product.oldPrice.toLocaleString()}</span>` : ''}
                        </div>
                        <button class="btn btn-red" style="width: 100%;" onclick="window.location.href='detail.html?id=${product.id}'">
                            <i class="fas fa-eye"></i> View Details
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function addToWishlist(productId) {
            let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            if (!wishlist.includes(productId)) {
                wishlist.push(productId);
                localStorage.setItem('wishlist', JSON.stringify(wishlist));
                alert('✅ Added to wishlist!');
            } else {
                alert('ℹ️ Already in wishlist');
            }
        }
        
        function addToCompare(productId) {
            let compareList = JSON.parse(localStorage.getItem('compareList')) || [];
            if (compareList.length >= 3) {
                alert('⚠️ Maximum 3 products can be compared');
                return;
            }
            if (!compareList.includes(productId)) {
                compareList.push(productId);
                localStorage.setItem('compareList', JSON.stringify(compareList));
                updateCompareCount();
                alert('✅ Added to comparison!');
            } else {
                alert('ℹ️ Already in comparison');
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadProductDetail);
    </script>
</body>
</html>
