<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TECH HUB</title>
    
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Simple Navigation -->
    <nav class="navbar">
        <div class="navbar-main">
            <div class="container">
                <a href="../../index.html" class="logo">
                    <i class="fas fa-microchip"></i> TECH<span>HUB</span>
                </a>
                <div style="display: flex; gap: 1rem;">
                    <a href="../../index.html" class="btn btn-outline">
                        <i class="fas fa-home"></i> Home
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="section">
        <div class="container" style="max-width: 600px;">
            <div class="card animate-scale-in">
                <div class="card-body" style="padding: 3rem;">
                    <div style="text-align: center; margin-bottom: 2rem;">
                        <div style="font-size: 4rem; color: var(--primary-red); margin-bottom: 1rem;">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Create Account</h1>
                        <p style="color: var(--gray);">Join TECH HUB today!</p>
                    </div>

                    <!-- Error Message Display -->
                    <div id="errorMessage" style="display: none; background: #fee; border: 1px solid #fcc; color: #c00; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
                        <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
                    </div>

                    <!-- Success Message Display -->
                    <div id="successMessage" style="display: none; background: #efe; border: 1px solid #cfc; color: #060; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
                        <i class="fas fa-check-circle"></i> <span id="successText"></span>
                    </div>

                    <form id="registerForm">
                        <div class="grid grid-2" style="gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label">
                                    <i class="fas fa-user"></i> First Name
                                </label>
                                <input type="text" class="form-control" id="firstName" placeholder="John" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">
                                    <i class="fas fa-user"></i> Last Name
                                </label>
                                <input type="text" class="form-control" id="lastName" placeholder="Doe" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-envelope"></i> Email Address
                            </label>
                            <input type="email" class="form-control" id="registerEmail" placeholder="your@email.com" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-phone"></i> Phone Number
                            </label>
                            <input type="tel" class="form-control" id="phone" placeholder="01234567890" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-lock"></i> Password
                            </label>
                            <input type="password" class="form-control" id="registerPassword" placeholder="Minimum 6 characters" required minlength="6">
                            <small style="color: var(--gray); font-size: 0.875rem;">Must be at least 6 characters long</small>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-lock"></i> Confirm Password
                            </label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required minlength="6">
                        </div>

                        <div class="form-group">
                            <label style="display: flex; align-items: start; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" id="terms" required style="margin-top: 0.25rem;">
                                <span style="font-size: 0.9rem;">
                                    I agree to the <a href="#" style="color: var(--primary-red);">Terms & Conditions</a> 
                                    and <a href="#" style="color: var(--primary-red);">Privacy Policy</a>
                                </span>
                            </label>
                        </div>

                        <button type="button" id="registerBtn" class="btn btn-red" style="width: 100%; margin-bottom: 1rem;">
                            <i class="fas fa-user-plus"></i> Create Account
                        </button>

                        <div style="text-align: center; margin-top: 1.5rem;">
                            <p style="color: var(--gray);">
                                Already have an account? 
                                <a href="login.html" style="color: var(--primary-red); font-weight: 600; text-decoration: none;">
                                    Login here
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Load Firebase First -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCdjvP3rdz60el3RPvI2AP5H2LQgnIEwMY",
  authDomain: "tech-hub-8088a.firebaseapp.com",
  projectId: "tech-hub-8088a",
  storageBucket: "tech-hub-8088a.firebasestorage.app",
  messagingSenderId: "792429684960",
  appId: "1:792429684960:web:e9a5681688f14352c78885",
  measurementId: "G-GEDXV1C21F"
};

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log('✅ Firebase initialized on register page');

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const successDiv = document.getElementById('successMessage');
            
            successDiv.style.display = 'none';
            errorText.textContent = message;
            errorDiv.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            setTimeout(() => { errorDiv.style.display = 'none'; }, 5000);
            console.error('❌ Error:', message);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            const errorDiv = document.getElementById('errorMessage');
            
            errorDiv.style.display = 'none';
            successText.textContent = message;
            successDiv.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            console.log('✅ Success:', message);
        }

        // Get error message
        function getErrorMessage(errorCode) {
            const errorMessages = {
                'auth/email-already-in-use': 'This email is already registered. Please login instead.',
                'auth/invalid-email': 'Invalid email address format.',
                'auth/operation-not-allowed': 'Email/Password authentication is not enabled in Firebase Console.',
                'auth/weak-password': 'Password is too weak. Please use at least 6 characters.',
                'auth/network-request-failed': 'Network error. Please check your internet connection.'
            };
            return errorMessages[errorCode] || `Error: ${errorCode}`;
        }

        // Handle registration
        async function handleRegister() {
            console.log('🚀 Register button clicked!');
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const termsAccepted = document.getElementById('terms').checked;
            
            console.log('📝 Form data:', { firstName, lastName, email, phone });
            
            // Validate terms
            if (!termsAccepted) {
                showError('Please accept the Terms & Conditions');
                return;
            }
            
            // Validate passwords match
            if (password !== confirmPassword) {
                showError('Passwords do not match!');
                return;
            }
            
            // Validate password length
            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }
            
            const submitBtn = document.getElementById('registerBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
            submitBtn.disabled = true;
            
            try {
                console.log('📞 Creating user account...');
                
                // Create user
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                console.log('✅ User created:', userCredential.user.uid);
                
                // Update profile with display name
                const displayName = `${firstName} ${lastName}`;
                await updateProfile(userCredential.user, { displayName });
                console.log('✅ Profile updated with name');
                
                // Save additional user data to Firestore
                try {
                    await setDoc(doc(db, 'users', userCredential.user.uid), {
                        firstName: firstName,
                        lastName: lastName,
                        email: email,
                        phone: phone,
                        role: 'customer',
                        createdAt: new Date()
                    });
                    console.log('✅ User data saved to Firestore');
                } catch (firestoreError) {
                    console.warn('⚠️ Firestore save failed (non-critical):', firestoreError);
                }
                
                showSuccess('Account created successfully! Redirecting to login...');
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                console.error('💥 Registration error:', error);
                console.error('Error code:', error.code);
                console.error('Error message:', error.message);
                
                showError(getErrorMessage(error.code));
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }

        // Attach click handler when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ DOM loaded, attaching button handler');
            
            const registerBtn = document.getElementById('registerBtn');
            if (registerBtn) {
                registerBtn.addEventListener('click', handleRegister);
                console.log('✅ Register button handler attached');
            } else {
                console.error('❌ Register button not found!');
            }
        });
    </script>
</body>
</html>
