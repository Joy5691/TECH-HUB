<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - TECH HUB</title>
    
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-top">
            <div class="container">
                <div>
                    <i class="fas fa-phone"></i> +880 1234-567890
                    <i class="fas fa-envelope"></i> support@techhub.com
                </div>
                <div>
                    <a href="#">Track Order</a>
                    <a href="#">Help</a>
                </div>
            </div>
        </div>
        
        <div class="navbar-main">
            <div class="container">
                <a href="../../index.html" class="logo">
                    <i class="fas fa-microchip"></i> TECH<span>HUB</span>
                </a>
                
                <div class="search-bar">
                    <input type="text" placeholder="Search products..." id="searchInput">
                    <button onclick="performSearch()"><i class="fas fa-search"></i></button>
                </div>
                
                <div class="nav-icons">
                    <div class="nav-icon" onclick="window.location.href='dashboard.html'">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="nav-icon" onclick="window.location.href='../products/comparison.html'">
                        <i class="fas fa-exchange-alt"></i>
                        <span class="badge" id="compareCount">0</span>
                    </div>
                    <div class="nav-icon" onclick="window.location.href='cart.html'">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge" id="cartCount">0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="navbar-menu">
            <div class="container">
                <a href="../../index.html" class="menu-item">Home</a>
                <a href="../products/categories.html?cat=laptop" class="menu-item">Laptops</a>
                <a href="../products/categories.html?cat=desktop" class="menu-item">Desktops</a>
                <a href="../products/categories.html?cat=phone" class="menu-item">Phones</a>
                <a href="../products/listing.html" class="menu-item">All Products</a>
                <a href="../../contact.html" class="menu-item">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Wishlist Section -->
    <section class="section">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1 style="font-size: 2rem;">
                    <i class="fas fa-heart"></i> My Wishlist
                </h1>
                <a href="dashboard.html" class="btn btn-outline">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>

            <div id="wishlistContainer">
                <div style="text-align: center; padding: 3rem;">
                    <div class="spinner" style="margin: 0 auto;"></div>
                    <p style="color: var(--gray); margin-top: 1rem;">Loading wishlist...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom text-center" style="padding: 2rem 0;">
                <p>&copy; 2025 TECH HUB. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="../../js/products.js"></script>
    <script src="../../js/cart.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        function loadWishlist() {
            const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            const container = document.getElementById('wishlistContainer');

            if (wishlist.length === 0) {
                container.innerHTML = `
                    <div class="card">
                        <div class="card-body" style="text-align: center; padding: 3rem;">
                            <div style="font-size: 5rem; margin-bottom: 1rem;">💔</div>
                            <h2>Your wishlist is empty</h2>
                            <p style="color: var(--gray); margin-bottom: 2rem;">Add products you love to your wishlist!</p>
                            <a href="../products/listing.html" class="btn btn-red">
                                <i class="fas fa-shopping-bag"></i> Browse Products
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            const products = wishlist.map(id => productManager.getProductById(id)).filter(p => p !== undefined);

            container.innerHTML = `
                <div class="grid grid-auto">
                    ${products.map(product => `
                        <div class="card hover-lift">
                            ${product.discount > 0 ? `<div class="discount-badge">-${product.discount}%</div>` : ''}
                            <button onclick="removeFromWishlist('${product.id}')" style="position: absolute; top: 1rem; right: 1rem; background: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); color: var(--danger); font-size: 1.25rem;">
                                <i class="fas fa-times"></i>
                            </button>
                            <div class="card-img" style="display: flex; align-items: center; justify-content: center; font-size: 5rem;">
                                ${product.image}
                            </div>
                            <div class="card-body">
                                <h3 class="card-title">${product.name}</h3>
                                <div style="margin: 1rem 0;">
                                    <span class="price">৳${product.price.toLocaleString()}</span>
                                    ${product.oldPrice ? `<span class="price-old">৳${product.oldPrice.toLocaleString()}</span>` : ''}
                                </div>
                                <div style="display: flex; gap: 0.5rem;">
                                    <button class="btn btn-red" style="flex: 1;" onclick="addToCart('${product.id}', '${product.name}', ${product.price}); removeFromWishlist('${product.id}')">
                                        <i class="fas fa-cart-plus"></i> Add to Cart
                                    </button>
                                    <button class="btn btn-outline" onclick="window.location.href='../products/detail.html?id=${product.id}'">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function removeFromWishlist(productId) {
            let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            wishlist = wishlist.filter(id => id !== productId);
            localStorage.setItem('wishlist', JSON.stringify(wishlist));
            loadWishlist();
        }

        window.removeFromWishlist = removeFromWishlist;

        document.addEventListener('DOMContentLoaded', loadWishlist);
    </script>
</body>
</html>
