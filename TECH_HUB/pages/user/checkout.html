<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - TECH HUB</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Simple Navigation -->
    <nav class="navbar">
        <div class="navbar-main">
            <div class="container">
                <a href="../../index.html" class="logo">
                    <i class="fas fa-microchip"></i>
                    TECH<span>HUB</span>
                </a>
                <div style="display: flex; align-items: center; gap: 2rem;">
                    <div style="display: flex; align-items: center; gap: 1rem; color: var(--gray);">
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <div style="width: 30px; height: 30px; border-radius: 50%; background: var(--primary-red); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.875rem;">1</div>
                            <span style="font-size: 0.9rem;">Cart</span>
                        </div>
                        <i class="fas fa-chevron-right" style="font-size: 0.75rem;"></i>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <div style="width: 30px; height: 30px; border-radius: 50%; background: var(--primary-red); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.875rem;">2</div>
                            <span style="font-size: 0.9rem; font-weight: 600; color: var(--primary-red);">Checkout</span>
                        </div>
                        <i class="fas fa-chevron-right" style="font-size: 0.75rem;"></i>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <div style="width: 30px; height: 30px; border-radius: 50%; background: var(--light-gray); color: var(--gray); display: flex; align-items: center; justify-content: center; font-size: 0.875rem;">3</div>
                            <span style="font-size: 0.9rem;">Complete</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Checkout Section -->
    <section class="section">
        <div class="container">
            <h1 style="font-size: 2rem; margin-bottom: 2rem;">
                <i class="fas fa-shopping-cart"></i> Checkout
            </h1>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
                <!-- Checkout Form -->
                <div>
                    <form id="checkoutForm" onsubmit="handleCheckout(event)">
                        <!-- Billing Information -->
                        <div class="card" style="margin-bottom: 2rem;">
                            <div class="card-body">
                                <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;">
                                    <i class="fas fa-user"></i> Billing Information
                                </h2>

                                <div class="grid grid-2" style="gap: 1rem;">
                                    <div class="form-group">
                                        <label class="form-label">First Name *</label>
                                        <input type="text" class="form-control" name="firstName" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Last Name *</label>
                                        <input type="text" class="form-control" name="lastName" required>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Email Address *</label>
                                    <input type="email" class="form-control" name="email" required>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Phone Number *</label>
                                    <input type="tel" class="form-control" name="phone" required>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Street Address *</label>
                                    <input type="text" class="form-control" name="address" required>
                                </div>

                                <div class="grid grid-3" style="gap: 1rem;">
                                    <div class="form-group">
                                        <label class="form-label">City *</label>
                                        <input type="text" class="form-control" name="city" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">State/Region *</label>
                                        <input type="text" class="form-control" name="state" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">ZIP Code *</label>
                                        <input type="text" class="form-control" name="zip" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Payment Method -->
                        <div class="card">
                            <div class="card-body">
                                <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;">
                                    <i class="fas fa-credit-card"></i> Payment Method
                                </h2>

                                <div class="form-group">
                                    <label style="display: block; padding: 1rem; border: 2px solid var(--light-gray); border-radius: var(--radius-md); margin-bottom: 0.75rem; cursor: pointer;">
                                        <input type="radio" name="payment" value="card" checked> 
                                        <i class="fas fa-credit-card" style="color: var(--primary-red); margin: 0 0.5rem;"></i>
                                        Credit/Debit Card
                                    </label>
                                    <label style="display: block; padding: 1rem; border: 2px solid var(--light-gray); border-radius: var(--radius-md); margin-bottom: 0.75rem; cursor: pointer;">
                                        <input type="radio" name="payment" value="bkash"> 
                                        <i class="fas fa-mobile-alt" style="color: var(--primary-red); margin: 0 0.5rem;"></i>
                                        bKash
                                    </label>
                                    <label style="display: block; padding: 1rem; border: 2px solid var(--light-gray); border-radius: var(--radius-md); margin-bottom: 0.75rem; cursor: pointer;">
                                        <input type="radio" name="payment" value="nagad"> 
                                        <i class="fas fa-wallet" style="color: var(--primary-red); margin: 0 0.5rem;"></i>
                                        Nagad
                                    </label>
                                    <label style="display: block; padding: 1rem; border: 2px solid var(--light-gray); border-radius: var(--radius-md); cursor: pointer;">
                                        <input type="radio" name="payment" value="cod"> 
                                        <i class="fas fa-money-bill-wave" style="color: var(--primary-red); margin: 0 0.5rem;"></i>
                                        Cash on Delivery
                                    </label>
                                </div>

                                <div class="form-group">
                                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                        <input type="checkbox" name="terms" required>
                                        <span>I agree to the <a href="#" style="color: var(--primary-red);">Terms & Conditions</a></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Order Summary -->
                <div>
                    <div class="card" style="position: sticky; top: 100px;">
                        <div class="card-body">
                            <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Order Summary</h2>

                            <!-- Sample Order Items -->
                            <div style="margin-bottom: 1.5rem;">
                                <div style="display: flex; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--light-gray); margin-bottom: 1rem;">
                                    <div style="font-size: 2rem;">💻</div>
                                    <div style="flex: 1;">
                                        <h4 style="font-size: 0.95rem; margin-bottom: 0.25rem;">Gaming Laptop</h4>
                                        <p style="color: var(--gray); font-size: 0.875rem;">Qty: 1</p>
                                    </div>
                                    <div style="font-weight: 600;">57,999৳</div>
                                </div>
                                
                                <div style="display: flex; gap: 1rem; padding-bottom: 1rem;">
                                    <div style="font-size: 2rem;">🖱️</div>
                                    <div style="flex: 1;">
                                        <h4 style="font-size: 0.95rem; margin-bottom: 0.25rem;">Gaming Mouse</h4>
                                        <p style="color: var(--gray); font-size: 0.875rem;">Qty: 1</p>
                                    </div>
                                    <div style="font-weight: 600;">2,500৳</div>
                                </div>
                            </div>

                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                                <span style="color: var(--gray);">Subtotal:</span>
                                <span style="font-weight: 600;">60,499৳</span>
                            </div>

                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                                <span style="color: var(--gray);">Shipping:</span>
                                <span style="font-weight: 600; color: var(--success);">FREE</span>
                            </div>

                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                                <span style="color: var(--gray);">Tax:</span>
                                <span style="font-weight: 600;">0৳</span>
                            </div>

                            <div style="border-top: 2px solid var(--light-gray); margin: 1rem 0;"></div>

                            <div style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
                                <span style="font-size: 1.25rem; font-weight: 700;">Total:</span>
                                <span style="font-size: 1.5rem; font-weight: 700; color: var(--primary-red);">60,499৳</span>
                            </div>

                            <button type="submit" form="checkoutForm" class="btn btn-red" style="width: 100%;">
                                <i class="fas fa-check-circle"></i> Place Order
                            </button>

                            <p style="text-align: center; color: var(--gray); font-size: 0.875rem; margin-top: 1rem;">
                                <i class="fas fa-lock"></i> Secure Checkout
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom text-center" style="padding: 2rem 0;">
                <p>&copy; 2025 TECH HUB. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="../../js/validation.js"></script>
    <script>
        function handleCheckout(event) {
            event.preventDefault();

            // Validate form
            if (!formValidator.validateForm(event.target)) {
                return;
            }

            const formData = new FormData(event.target);
            const orderData = Object.fromEntries(formData);

            console.log('Order placed:', orderData);

            // Show loading
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            submitBtn.disabled = true;

            // Simulate order processing
            setTimeout(() => {
                alert('✅ Order placed successfully! Order ID: #ORD-' + Math.floor(Math.random() * 10000));
                
                // Clear cart
                localStorage.removeItem('cart');
                
                // Redirect to success page
                window.location.href = 'orders.html';
            }, 2000);
        }

        // Setup validation
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('checkoutForm');
            if (form) {
                formValidator.setupRealTimeValidation(form);
            }
        });
    </script>
</body>
</html>
